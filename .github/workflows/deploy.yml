name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            *.zip
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - name: Unzip site
        run: |
          mkdir -p _site
          [ -f media.zip ] && unzip -q -o media.zip -d _site
        
