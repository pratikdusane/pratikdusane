name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site
        shell: bash
        run: |
          set +e
          ls -la
          mkdir -p _site
          unzip -o site.zip -d _site > unzip.log
          code=$?
          tail -n 5 unzip.log
          if [ $code -gt 1 ]; then echo "unzip failed with code $code"; cat unzip.log; exit 1; fi
          echo "files deployed: $(find _site -type f | wc -l)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
